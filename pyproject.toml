[project]
name = "tlde"
version = "0.1.0"
description = "Too Long Didn't Emulate — multi-agent Renode emulation pipeline"
readme = "README.md"
authors = [
    { name = "pcorrect", email = "dionisis.spiliopoulos@canonical.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "cmsis-svd>=0.6",
    "devicetree>=0.0.2",
    "github-copilot-sdk>=0.3.0",
    "httpx>=0.28.1",
    "mcp>=1.27.2",
    "pdfplumber>=0.11.9",
    "pydantic>=2.0",
    "pymupdf4llm>=1.27.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.5.0",
    "tqdm>=4.66",
]

[project.scripts]
tlde = "tlde.pipeline.firmware_emulation:_cli"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
